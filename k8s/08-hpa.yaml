apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stream-service-hpa
  namespace: netflix-replica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stream-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
