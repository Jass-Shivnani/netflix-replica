apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: netflix-replica
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
    spec:
      containers:
        - name: streaming-service
          image: netflixreplica-stream-service-1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HLS_DIR
              value: "/var/media/hls"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: media-storage
              mountPath: /var/media
              readOnly: true
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: netflix-replica
spec:
  selector:
    app: stream-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stream-service-headless
  namespace: netflix-replica
spec:
  clusterIP: None
  selector:
    app: stream-service
  ports:
    - port: 8080
      targetPort: 8080
