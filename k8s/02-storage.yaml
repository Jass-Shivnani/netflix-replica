apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: netflix-replica
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: netflix-replica
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
