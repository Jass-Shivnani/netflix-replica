apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: netflix-replica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-gateway
          image: netflixreplica-api-service-1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: RAW_DIR
              value: "/var/media/raw"
            - name: HLS_DIR
              value: "/var/media/hls"
            - name: DATA_DIR
              value: "/var/lib/sqlite"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: media-storage
              mountPath: /var/media
            - name: data-storage
              mountPath: /var/lib/sqlite
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc
        - name: data-storage
          persistentVolumeClaim:
            claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: netflix-replica
spec:
  selector:
    app: api-service
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-headless
  namespace: netflix-replica
spec:
  clusterIP: None
  selector:
    app: api-service
  ports:
    - port: 5000
      targetPort: 5000
