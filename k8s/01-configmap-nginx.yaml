apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: netflix-replica
data:
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        tcp_nopush      on;
        tcp_nodelay     on;
        keepalive_timeout  65;

        # Kubernetes Cluster DNS
        resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

        server {
            listen 80;
            server_name localhost;
            client_max_body_size 500M;

            gzip on;
            gzip_types application/vnd.apple.mpegurl application/json text/plain text/css application/javascript;

            location / {
                root /usr/share/nginx/html;
                index index.html;
                try_files $uri $uri/ /index.html;
            }

            location /api/cluster/events {
                set $api_backend "http://api-service:5000";
                proxy_pass $api_backend;
                proxy_set_header Host $host;
                proxy_set_header Connection '';
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_cache off;
            }

            location /api/ {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
                    return 204;
                }
                proxy_hide_header Access-Control-Allow-Origin;
                add_header 'Access-Control-Allow-Origin' '*' always;

                set $api_backend "http://api-service:5000";
                proxy_pass $api_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            }

            location /stream/ {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, If-Range' always;
                    return 204;
                }
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Expose-Headers;
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, X-Served-By, X-Active-Connections' always;

                set $stream_backend "http://stream-service:8080";
                proxy_pass $stream_backend;
                proxy_set_header Host $host;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
                add_header Cache-Control "no-cache";
            }

            location /health {
                default_type application/json;
                return 200 '{"status":"healthy","orchestrator":"kubernetes","service":"nginx-lb"}';
            }
        }
    }
