worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Docker Embedded DNS for Dynamic Swarm & Compose Service Discovery
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 500M;

        # Gzip Compression
        gzip on;
        gzip_types application/vnd.apple.mpegurl application/json text/plain text/css application/javascript;

        # Static Frontend (Netflix Replica Web Application)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Server-Sent Events for Live Topology Telemetry
        location /api/cluster/events {
            set $api_backend "http://api-service:5000";
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # API Gateway Route (Dynamic Docker Swarm / Service Mesh Load Balancing)
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'X-Served-By, X-Service-Type, X-Cache' always;

            set $api_backend "http://api-service:5000";
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }

        # HLS Video Streaming Route (Dynamic Docker Swarm / Service Mesh + Cross-Origin Mobile Failover)
        location /stream/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range, If-Range' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Expose-Headers;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length, X-Served-By, X-Active-Connections, X-Chunk-Index' always;

            set $stream_backend "http://stream-service:8080";
            proxy_pass $stream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            
            # Pass byte-range headers for seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            add_header Cache-Control "no-cache";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # Active Load Balancer Health Probe
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"load-balancer","algorithm":"swarm_ipvs_least_conn","upstream_pools":["api-service:5000","stream-service:8080"]}';
        }
    }
}
