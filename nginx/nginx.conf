worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Upstream Pool for Web / API Gateway (Least-Conn)
    upstream api_cluster {
        least_conn;
        server api-service-1:5000 max_fails=3 fail_timeout=10s;
        server api-service-2:5000 max_fails=3 fail_timeout=10s;
    }

    # Upstream Pool for HLS Streaming Service (Least-Conn)
    upstream stream_cluster {
        least_conn;
        server stream-service-1:8080 max_fails=3 fail_timeout=10s;
        server stream-service-2:8080 max_fails=3 fail_timeout=10s;
        server stream-service-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip Compression
        gzip on;
        gzip_types application/vnd.apple.mpegurl application/json text/plain text/css application/javascript;

        # Static Frontend (Netflix Replica Web Application)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API Gateway Route
        location /api/ {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # HLS Video Streaming Route
        location /stream/ {
            proxy_pass http://stream_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pass byte-range headers for seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            add_header Cache-Control "no-cache";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # Active Load Balancer Health Probe
        location /health {
            return 200 '{"status":"healthy","service":"load-balancer","algorithm":"least_conn","upstream_pools":["api_cluster","stream_cluster"]}';
            add_header Content-Type application/json;
        }
    }
}
